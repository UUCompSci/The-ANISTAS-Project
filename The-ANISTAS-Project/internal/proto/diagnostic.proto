syntax = "proto3";

package diagnostic;

option go_package = "github.com/UUCompSci/The-ANISTAS-Project/internal/proto";

// Service 1: Diagnostic Service
service DiagnosticService {
  rpc RunFTDiagnostics (DiagnosticsRequest) returns (DiagnosticsResponse);
}

message DiagnosticsRequest {
  string target_host = 1;
  bool include_powershell = 2;  // Use PowerShell for enhanced Windows info
}

message FTPConfig {
  string service_name = 1;
  bool is_running = 2;
  bool is_ftps = 3;           // FTPS (FTP over TLS) vs plain FTP
  string tls_version = 4;     // TLS 1.2, 1.3, or empty if unencrypted
  int32 port = 5;
  bool anonymous_access = 6;  // Dangerous for NIST compliance
  repeated string allowed_ips = 7;
  string fips_compliant = 8;  // "true", "false", or "unknown"
}

message DiagnosticsResponse {
  bool success = 1;
  string error_message = 2;
  FTPConfig ftp_config = 3;
  repeated string raw_powershell_output = 4;  // For audit trail
  int64 timestamp_unix = 5;
}