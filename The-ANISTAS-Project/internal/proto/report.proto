syntax = "proto3";

package report;

option go_package = "github.com/UUCompSci/The-ANISTAS-Project/internal/proto";

// Correct imports: relative to the project root (or -I path)
import "internal/proto/diagnostic.proto";
import "internal/proto/compliance.proto";

// Service 3: PDF Report Service
service ReportService {
  rpc GeneratePDF (GeneratePDFRequest) returns (GeneratePDFResponse);
}

message GeneratePDFRequest {
  diagnostic.DiagnosticsResponse diag_data = 1;
  compliance.ComplianceCheckResponse nist_data = 2;

  string report_title = 3;
  string organization = 4;
  string prepared_by = 5;
}


message GeneratePDFResponse {
  bool success = 1;
  bytes pdf_bytes = 2;        // Return PDF as bytes (or write to path)
  string output_path = 3;
  string error_message = 4;
}